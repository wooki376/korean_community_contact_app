<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="한인회 연락망">
<meta name="theme-color" content="#166534">
<meta name="robots" content="noindex, nofollow">
<title>한인회 연락망</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23166534' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Crect x='2' y='4' width='20' height='16' rx='2'/%3E%3Cpath d='m22 6-10 7L2 6'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@500;700;800&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* Color palette. Always a white background with a deep green accent (--primary) —
     this app intentionally does NOT switch to a dark theme, regardless of device mode. */
  :root{
    --bg:#FFFFFF; --surface:#FFFFFF; --surface-2:#FBF8F1;
    --ink:#23302B; --ink-soft:#5C6A63; --border:#F9D2BA;
    --primary:#166534; --primary-dark:#14532D; --primary-soft:#DCFCE7;
    --call:#2E9E5B; --call-soft:#E4F5EA;
    --mail:#2B6CB0; --mail-soft:#E6EEF8;
    --danger:#C0402E; --danger-soft:#FBEAE7;
    --shadow: 0 8px 24px -12px rgba(35,48,43,0.28);
    --radius-lg:20px; --radius-md:14px; --radius-sm:10px;
    color-scheme: light;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--bg); color:var(--ink); font-family:'Noto Sans KR', system-ui, -apple-system, 'Malgun Gothic', sans-serif; -webkit-font-smoothing:antialiased; min-height:100vh; overflow-x:hidden;}
  h1,h2,.display{font-family:'Gothic A1','Noto Sans KR',system-ui,sans-serif; font-weight:800; letter-spacing:-0.01em; text-wrap:balance; margin:0;}
  button{font-family:inherit;}
  a{color:inherit;}
  .tabular{font-variant-numeric:tabular-nums;}
  #app{max-width:560px; margin:0 auto; min-height:100vh; background:var(--bg); position:relative; padding-bottom:32px;}
  .topbar{position:sticky; top:0; z-index:20; background:var(--bg); padding:18px 18px 10px; border-bottom:1px solid transparent;}
  .topbar.scrolled{border-bottom-color:var(--border);}
  .brand-row{display:grid; grid-template-columns:40px 1fr 40px; align-items:center; gap:10px; margin-bottom:14px;}
  .brand{font-size:20px; text-align:center; grid-column:2;}
  .brand-mid{display:flex; align-items:center; justify-content:center; gap:8px; grid-column:2; min-width:0;}
  .brand-logo{height:30px; width:auto; flex:none;}
  .icon-btn{display:inline-flex; align-items:center; justify-content:center; width:40px; height:40px; border-radius:999px; border:1px solid var(--border); background:var(--surface); color:var(--ink); cursor:pointer; flex:none; transition:transform .15s ease;}
  .icon-btn:active{transform:scale(0.94);}
  .search-wrap{position:relative; margin-bottom:12px;}
  .search-wrap input{width:100%; padding:12px 14px 12px 40px; border-radius:999px; border:1px solid var(--border); background:var(--surface); color:var(--ink); font-size:15px; outline:none;}
  .search-wrap input:focus{border-color:var(--primary);}
  .search-wrap svg{position:absolute; left:13px; top:50%; transform:translateY(-50%); color:var(--ink-soft);}
  main{padding:6px 18px 100px;}
  .section-head{display:flex; align-items:center; justify-content:space-between; gap:8px; margin:22px 2px 10px; scroll-margin-top:150px;}
  .section-head h2{font-size:16px; font-weight:800; font-family:'Gothic A1','Noto Sans KR',sans-serif;}
  .section-head .cnt{font-size:12.5px; color:var(--ink-soft); font-weight:500; margin-left:6px;}
  .section-mail{width:32px; height:32px; border-radius:999px; border:none; background:var(--mail-soft); color:var(--mail); display:flex; align-items:center; justify-content:center; cursor:pointer; flex:none;}
  .contact-row{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md); padding:13px 14px; display:flex; align-items:center; gap:12px; margin-bottom:9px; cursor:pointer; transition:transform .12s ease;}
  .contact-row:active{transform:scale(0.985);}
  .contact-avatar{width:44px; height:44px; border-radius:999px; flex:none; display:flex; align-items:center; justify-content:center; font-weight:700; color:#fff; font-size:15px; font-family:'Gothic A1',sans-serif;}
  .contact-main{flex:1; min-width:0;}
  .contact-name-row{display:flex; align-items:center; gap:7px; flex-wrap:wrap;}
  .contact-name{font-weight:700; font-size:15.5px;}
  .contact-sub{font-size:13px; color:var(--ink-soft); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .row-actions{display:flex; gap:6px; flex:none;}
  .mini-btn{width:36px; height:36px; border-radius:999px; border:none; display:flex; align-items:center; justify-content:center; cursor:pointer; flex:none;}
  .mini-btn.call{background:var(--call-soft); color:var(--call);}
  .mini-btn.mail{background:var(--mail-soft); color:var(--mail);}
  .chev{color:var(--ink-soft); flex:none;}
  .empty-state{text-align:center; padding:48px 20px; color:var(--ink-soft);}
  .empty-state svg{margin-bottom:12px; opacity:.6;}
  .empty-state p{font-size:14.5px; line-height:1.6;}
  /* The "Send Email to Everyone" bar pinned to the bottom of the home screen.
     Uses its own fixed #006400 dark-green background (kept separate from --primary,
     which stays a slightly different green for other accents like the search focus ring). */
  .fab-bar{position:sticky; bottom:0; left:0; right:0; z-index:15; padding:14px 18px calc(14px + env(safe-area-inset-bottom)); background:linear-gradient(to top, var(--bg) 60%, transparent);}
  .fab-mail{width:100%; display:flex; align-items:center; justify-content:center; gap:9px; background:#1D4533; color:#fff; border:none; border-radius:999px; padding:15px 20px; font-size:15.5px; font-weight:700; cursor:pointer; box-shadow:var(--shadow);}
  .fab-mail:active{transform:scale(0.98);}
  .fab-mail[disabled]{opacity:.5; pointer-events:none;}
  .org-block{margin-bottom:26px;}
  .org-head{display:flex; align-items:center; justify-content:space-between; width:100%; background:none; border:none; border-bottom:2px solid var(--border); padding:2px 2px 10px; margin-bottom:10px; cursor:pointer; text-align:left;}
  .org-head:active{opacity:.7;}
  .org-name{font-size:19px; font-weight:800; font-family:'Gothic A1','Noto Sans KR',sans-serif; color:var(--ink);}
  .org-cnt{font-size:12.5px; color:var(--ink-soft); font-weight:500; margin-left:8px;}
  .org-empty-hint{font-size:13px; color:var(--ink-soft); padding:0 2px 4px; cursor:pointer;}
  .role-badge{font-size:11px; font-weight:700; color:var(--primary-dark); background:var(--primary-soft); padding:3px 8px; border-radius:999px; flex:none; white-space:nowrap;}
  .contact-meta{display:flex; align-items:center; gap:14px; margin-top:5px; flex-wrap:wrap; min-width:0;}
  .contact-meta span{display:flex; align-items:center; gap:5px; font-size:12.5px; color:var(--ink-soft); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:100%;}
  .contact-meta svg{flex:none; opacity:.75;}
  .overlay{position:fixed; inset:0; background:rgba(20,24,22,0.5); z-index:50; display:flex; align-items:flex-end; justify-content:center; opacity:0; pointer-events:none; transition:opacity .2s ease;}
  .overlay.open{opacity:1; pointer-events:auto;}
  .sheet{position:relative; width:100%; max-width:480px; background:var(--surface); border-radius:22px 22px 0 0; padding:14px 26px calc(30px + env(safe-area-inset-bottom)); transform:translateY(16px); transition:transform .22s ease; max-height:88vh; overflow-y:auto; box-shadow:var(--shadow);}
  .overlay.open .sheet{transform:translateY(0);}
  .sheet-handle{width:38px; height:4px; background:var(--border); border-radius:99px; margin:2px auto 6px;}
  .close-x{position:absolute; top:16px; right:18px; width:34px; height:34px; border-radius:999px; border:none; background:var(--surface-2); color:var(--ink-soft); display:flex; align-items:center; justify-content:center; cursor:pointer; flex:none;}
  .contact-avatar-lg{width:76px; height:76px; border-radius:50%; margin:14px auto 14px; display:flex; align-items:center; justify-content:center; font-weight:700; color:#fff; font-size:27px; font-family:'Gothic A1',sans-serif;}
  .contact-page-name{text-align:center; font-size:19px; font-weight:800; font-family:'Gothic A1','Noto Sans KR',sans-serif;}
  .contact-page-org{text-align:center; font-size:13.5px; color:var(--ink-soft); margin-top:4px; margin-bottom:28px;}
  .detail-row{display:flex; align-items:center; justify-content:space-between; gap:14px; margin-bottom:20px;}
  .detail-row-text{min-width:0; flex:1;}
  .detail-label{font-size:12.5px; color:var(--ink-soft); font-weight:600; margin-bottom:5px;}
  .detail-value{font-size:17px; font-weight:700; color:var(--ink); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .detail-value.email{color:var(--ink);}
  .detail-action{width:42px; height:42px; border-radius:999px; border:none; flex:none; display:flex; align-items:center; justify-content:center; cursor:pointer;}
  .detail-action.call{background:var(--call-soft); color:var(--call);}
  .detail-action.mail{background:var(--mail-soft); color:var(--mail);}
  .detail-action:active{transform:scale(0.94);}
  .hint{font-size:12.5px; color:var(--ink-soft); margin-top:6px; line-height:1.5;}
  .toast{position:fixed; left:50%; bottom:26px; transform:translateX(-50%); background:var(--ink); color:var(--bg); padding:10px 18px; border-radius:999px; font-size:13.5px; font-weight:600; z-index:80; opacity:0; pointer-events:none; transition:opacity .25s ease, transform .25s ease; box-shadow:var(--shadow);}

  /* -------- password gate -------- */
  .lock-wrap{min-height:100vh; min-height:100dvh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:40px 28px; text-align:center;}
  .lock-icon{width:56px; height:56px; border-radius:16px; background:var(--primary-soft); color:var(--primary-dark); display:flex; align-items:center; justify-content:center; margin-bottom:18px;}
  .lock-title{font-size:20px; font-weight:800; font-family:'Gothic A1','Noto Sans KR',sans-serif; color:var(--ink); margin-bottom:6px;}
  .lock-sub{font-size:13.5px; color:var(--ink-soft); margin-bottom:26px;}
  .lock-input{width:100%; max-width:280px; padding:13px 16px; border-radius:999px; border:1px solid var(--border); background:var(--surface); color:var(--ink); font-size:15px; text-align:center; outline:none; margin-bottom:12px;}
  .lock-input:focus{border-color:var(--primary);}
  .lock-btn{width:100%; max-width:280px; padding:13px 16px; border-radius:999px; border:none; background:var(--primary); color:#fff; font-weight:700; font-size:15px; cursor:pointer;}
  .lock-btn:active{transform:scale(0.98);}
  .lock-error{font-size:12.5px; color:var(--danger); margin-top:12px; min-height:16px;}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(-4px);}

  /* -------- 대분류/중분류 section headings on the home screen -------- */
  /* 대분류: a bold, full-width bar so it reads as the top-level heading at a glance. */
  .major-section{margin:28px 0 10px;}
  .major-section:first-child{margin-top:2px;}
  .major-title{display:block; width:100%; box-sizing:border-box; font-size:15px; font-weight:800; font-family:'Gothic A1','Noto Sans KR',sans-serif; color:#fff; background:var(--primary); padding:12px 16px; border-radius:var(--radius-sm) var(--radius-sm) 0 0; letter-spacing:.01em;}
  /* Everything belonging to that 대분류 sits inside a tinted "card" right under
     the bar, so 중분류 and its organizations visually read as nested inside it. */
  .major-body{background:var(--bg); border:1px solid var(--border); border-top:none; border-radius:0 0 var(--radius-md) var(--radius-md); padding:16px 14px 6px;}
  .mid-head{margin:6px 2px 10px;}
  .mid-head:first-child{margin-top:0;}
  .mid-title{display:inline-block; font-size:12px; font-weight:700; color:var(--primary-dark); background:var(--primary-soft); padding:4px 11px; border-radius:999px;}
  .mid-body{padding-left:10px; border-left:2px solid var(--border); margin-bottom:8px;}

  /* -------- org-picker sidebar (pale yellow, kept distinct from the app's green) -------- */
  .side-overlay{position:fixed; inset:0; background:rgba(20,24,22,0.45); z-index:60; opacity:0; pointer-events:none; transition:opacity .2s ease;}
  .side-overlay.open{opacity:1; pointer-events:auto;}
  .side-panel{position:fixed; top:0; left:0; bottom:0; width:86%; max-width:320px; background:#F7EAE0; box-shadow:var(--shadow); transform:translateX(-100%); transition:transform .24s ease; display:flex; flex-direction:column; padding:18px 0 calc(14px + env(safe-area-inset-bottom));}
  .side-overlay.open .side-panel{transform:translateX(0);}
  .side-head{display:flex; align-items:center; justify-content:space-between; padding:2px 18px 14px; border-bottom:1px solid #F9D2BA; flex:none;}
  .side-title{font-size:17px; font-weight:800; font-family:'Gothic A1','Noto Sans KR',sans-serif; color:#5E3122;}
  .side-toolbar{display:flex; gap:8px; padding:12px 18px; flex:none;}
  .side-link{border:1px solid #F0DE85; background:#FFF6C9; color:#5E3122; font-size:12.5px; font-weight:700; padding:6px 12px; border-radius:999px; cursor:pointer;}
  .side-list{flex:1; overflow-y:auto; padding:0 18px 8px;}
  .side-major-title{display:flex; align-items:center; gap:8px; width:fit-content; font-size:12px; font-weight:800; color:#5E3122; background:#F9D2BA; padding:4px 10px 4px 8px; border-radius:999px; margin:14px 0 6px; cursor:pointer;}
  .side-mid-title{display:flex; align-items:center; gap:8px; width:fit-content; font-size:12.5px; font-weight:700; color:#5E3122; background:#F9D2BA; padding:3px 9px 3px 7px; border-radius:999px; margin:10px 0 4px 4px; cursor:pointer;}
  .side-major-title input, .side-mid-title input{width:16px; height:16px; accent-color:#C9A400; flex:none;}
  .side-org-row{display:flex; align-items:center; gap:10px; padding:9px 4px; border-bottom:1px solid #F9D2BA; cursor:pointer;}
  .side-org-row input{width:18px; height:18px; accent-color:#C9A400; flex:none;}
  .side-org-name{flex:1; font-size:14.5px; font-weight:600; color:#5E3122;}
  .side-org-cnt{font-size:12px; color:#5E3122; flex:none;}
  .side-footer{padding:14px 18px 4px; border-top:1px solid #F9D2BA; flex:none;}
  .side-count{font-size:12.5px; color:#5E3122; margin-bottom:8px; text-align:center;}
  .side-mail-btn{width:100%; display:flex; align-items:center; justify-content:center; gap:8px; background:#F5C400; color:#5E3122; border:none; border-radius:999px; padding:13px 16px; font-size:14.5px; font-weight:800; cursor:pointer;}
  .side-mail-btn[disabled]{opacity:.5; pointer-events:none;}
  .side-mail-btn:active{transform:scale(0.98);}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast"></div>
<script>
/* =====================================================================
   한인회 연락망 (Korean Society Contact Directory) — a static build that
   reads its data from a published Google Sheet, meant for GitHub Pages.

   Fill in CONFIG.sheetCsvUrl below and the app will pull the sheet's
   content directly. Share the sheet as "Anyone with the link = Viewer",
   then paste a URL of this shape:
     https://docs.google.com/spreadsheets/d/{SHEET_ID}/gviz/tq?tqx=out:csv&sheet={TAB_NAME}
   (SHEET_ID is the string between /d/ and /edit in the sheet's URL;
   TAB_NAME is the sheet tab's name at the bottom — default is "시트1")
   ===================================================================== */
var CONFIG = {
  sheetCsvUrl: "https://docs.google.com/spreadsheets/d/1SYbT1xtFEurGKXkc3nswdHGtTSZX09YVHqpX6aV2HMU/gviz/tq?tqx=out:csv&sheet=Sheet1",
  // Password required to view the directory. Replace 여기 (between the quotes)
  // with whatever password you want people to enter — keep the quotes.
  // Example: password: "hansarang2026"
  password: "123456"
};

// Sample data shown when no sheet is configured yet, or the sheet fails to load.
// In real use this gets fully replaced by the Google Sheet (CSV) data; this stays
// untouched as a fallback.
var FALLBACK_DATA = {
  appTitle: "한인회 연락망",
  categories: [
    { id: "cat-1", name: "한인회", contacts: [ { id: "s-1", name: "홍길동 (예시)", role: "회장 · 예시 데이터", phone: "", email: "", lead: true } ] },
    { id: "cat-2", name: "옥타 (OKTA)", contacts: [] },
    { id: "cat-3", name: "노인회", contacts: [] },
    { id: "cat-4", name: "상공인연합회", contacts: [] }
  ]
};

// The data actually shown on screen. Starts out as the sample data, then gets
// swapped for the real thing once loadData() successfully fetches the sheet.
var DATA = FALLBACK_DATA;

// Tracks which screen the app is currently showing.
// view: 'home' (the organization list) or 'category' (one organization's full roster)
// query: the current text typed into the search box
// categoryId: the organization currently open (or that the open contact belongs to)
// contactId: the contact currently shown in the popup (null = popup closed)
// unlocked: whether the password screen has been passed. Starts false and gets
// flipped to true either immediately (if this device already unlocked it before,
// see LOCK_KEY below) or once the visitor types the right password.
// sidebarOpen: whether the left "pick organizations" panel is open.
// selectedOrgIds: map of organization id -> true for the org-picker sidebar's
// checkboxes (which orgs are checked for the "email selected organizations" button).
var session = { view: 'home', query: '', categoryId: null, contactId: null, unlocked: false, sidebarOpen: false, selectedOrgIds: {} };

/* ---------------- password gate ---------------- */
// If CONFIG.password is left blank (empty string), the gate is skipped entirely —
// useful while testing. As soon as a real password is set, the gate is enforced.
var LOCK_KEY = 'gigroster-unlocked-v1';
(function initLockState() {
  if (!CONFIG.password) { session.unlocked = true; return; }
  try { session.unlocked = localStorage.getItem(LOCK_KEY) === '1'; } catch (e) { session.unlocked = false; }
})();
// Checks the value typed into the password screen. On a match, remembers it in
// this browser's localStorage so the same device isn't asked again next time.
function tryUnlock() {
  var input = document.getElementById('lock-input');
  var entered = input ? input.value : '';
  if (entered === CONFIG.password) {
    session.unlocked = true;
    try { localStorage.setItem(LOCK_KEY, '1'); } catch (e) { }
    render();
  } else {
    var err = document.getElementById('lock-error');
    if (err) err.textContent = '비밀번호가 올바르지 않습니다.';
    if (input) { input.value = ''; input.focus(); }
  }
}

/* ---------------- icons ---------------- */
/* Inline SVG icons reused throughout the app, kept as ready-made strings.
   The variable name tells you what each one is (e.g. ICON_CALL = phone, ICON_MAIL = envelope). */
var ICON_MENU = '<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg>';
var ICON_LOCK = '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>';
var ICON_ROLE = '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>';
var ICON_CALL = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>';
var ICON_MAIL = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 6-10 7L2 6"/></svg>';
var ICON_CLOSE = '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>';

/* ---------------- utils ---------------- */
// Escapes special characters so names/phone numbers can be safely dropped into HTML.
// (Without this, a name containing <, > etc. could break the layout or open up an
// injection risk.)
function escapeHtml(str) {
  return String(str == null ? '' : str).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
// Picks the letter(s) to show inside an avatar circle (first character for Korean
// names, first two initials for others).
function initials(name) {
  var trimmed = (name || '').trim();
  if (!trimmed) return '?';
  var first = trimmed[0];
  if (/[가-힣]/.test(first)) return first;
  var parts = trimmed.split(/\s+/).filter(Boolean);
  if (parts.length >= 2) return (parts[0][0] + parts[1][0]).toUpperCase();
  return trimmed.slice(0, 2).toUpperCase();
}
// Picks a color from the palette based on the name, so the same person always
// gets the same avatar color.
function colorForString(str) {
  var h = 0, s = String(str || '');
  for (var i = 0; i < s.length; i++) { h = (h * 31 + s.charCodeAt(i)) >>> 0; }
  return AVATAR_PALETTE[h % AVATAR_PALETTE.length];
}
// Turns a phone number into a "tel:" link so tapping it opens the phone app.
// Returns null when there's no number.
function telHref(phone) {
  if (!phone) return null;
  var cleaned = phone.replace(/[^0-9+]/g, '');
  return cleaned ? 'tel:' + cleaned : null;
}
// Turns an email address into a "mailto:" link (tapping it opens a new email draft).
function mailHref(email) { return email ? 'mailto:' + email.trim() : null; }
// Collects every email address inside one organization to build a
// "email this whole organization" link.
function groupMailHref(cat) {
  var emails = cat.contacts.map(function (c) { return c.email; }).filter(Boolean);
  if (!emails.length) return null;
  var subject = encodeURIComponent('[' + cat.name + '] 안내 메일');
  return 'mailto:' + emails.join(',') + '?subject=' + subject;
}
// Collects every email address across every organization for the bottom
// "Send Email to Everyone" button.
function allMailHref() {
  var emails = [];
  DATA.categories.forEach(function (cat) { cat.contacts.forEach(function (c) { if (c.email) emails.push(c.email); }); });
  if (!emails.length) return null;
  var subject = encodeURIComponent('[' + (DATA.appTitle || '한인회 연락망') + '] 안내 메일');
  return 'mailto:' + emails.join(',') + '?subject=' + subject;
}
// Look up an organization by id / look up one contact inside that organization by id.
// Shared helpers used all over the app.
function findCategory(id) { return DATA.categories.find(function (c) { return c.id === id; }); }
function findContact(cat, id) { return cat ? cat.contacts.find(function (c) { return c.id === id; }) : null; }

/* ---------------- CSV parsing ----------------
   Publishing a Google Sheet "to the web" as CSV gives us comma-separated text.
   This section turns that raw text into the { organization, name, contact... }
   shape the rest of the app works with. */
// Splits raw CSV text into rows, then cells (handling commas/quotes correctly).
// (CSV exported from Excel/Google Sheets can wrap a cell in quotes when it contains
// a comma or line break, so a naive split on "," would corrupt those cells — this
// walks the text character by character, tracking whether we're inside quotes.)
function parseCSV(text) {
  var rows = [], row = [], field = '', inQuotes = false;
  for (var i = 0; i < text.length; i++) {
    var c = text[i];
    if (inQuotes) {
      if (c === '"') { if (text[i + 1] === '"') { field += '"'; i++; } else { inQuotes = false; } }
      else { field += c; }
    } else {
      if (c === '"') { inQuotes = true; }
      else if (c === ',') { row.push(field); field = ''; }
      else if (c === '\n') { row.push(field); rows.push(row); row = []; field = ''; }
      else if (c === '\r') { /* skip */ }
      else { field += c; }
    }
  }
  if (field.length || row.length) { row.push(field); rows.push(row); }
  return rows.filter(function (r) { return r.length && r.some(function (v) { return v !== ''; }); });
}
// Turns an organization name (including Korean text) into a safe id string
// (e.g. "한인회" → "한인회", "OKTA!" → "OKTA").
function slugify(str) {
  return String(str || '').trim().replace(/[^a-zA-Z0-9가-힣]+/g, '-').replace(/^-+|-+$/g, '') || 'cat';
}
// Converts the parsed CSV rows (a 2D array) into the app's data structure.
// Whatever value is in the "카테고리" (organization) column becomes an organization
// (this is the 소분류 level) — however many distinct ones appear in the sheet
// (4, 10, 20...) all show up automatically. The organization count is NOT
// hard-coded anywhere in this file. A "대표" (leader) column value of Y/예/1/etc.
// marks that person to appear on the home screen as a leader.
// Two more columns tag each organization with where it sits in the bigger
// picture: "대분류" (major category, e.g. 주요 단체 / 일반 단체) and a mid-level
// column read as "중분류" if that header exists, otherwise falling back to
// "소분류" (the name currently used in the sheet for that same column) — either
// way it becomes cat.mid. Both are optional per row; an organization with no
// 중분류 value is simply grouped directly under its 대분류 later on.
function csvRowsToCategories(rows) {
  if (!rows.length) return [];
  var header = rows[0].map(function (h) { return h.trim(); });
  var midIdx = header.indexOf('중분류');
  if (midIdx === -1) midIdx = header.indexOf('소분류');
  var idx = { cat: header.indexOf('카테고리'), name: header.indexOf('이름'), role: header.indexOf('역할'), phone: header.indexOf('전화번호'), email: header.indexOf('이메일'), lead: header.indexOf('대표'), major: header.indexOf('대분류'), mid: midIdx };
  if (idx.cat === -1 || idx.name === -1) return [];
  var LEAD_TRUE = { 'y': 1, 'yes': 1, 'true': 1, '1': 1, 'o': 1, '예': 1, '대표': 1, '대장': 1 };
  var catMap = {}, catMeta = {}, order = [], counter = 0;
  for (var r = 1; r < rows.length; r++) {
    var row = rows[r];
    var catName = (row[idx.cat] || '').trim();
    if (!catName) continue;
    if (!catMap[catName]) { catMap[catName] = []; order.push(catName); catMeta[catName] = { major: '', mid: '' }; }
    var majorVal = idx.major > -1 ? (row[idx.major] || '').trim() : '';
    var midVal = idx.mid > -1 ? (row[idx.mid] || '').trim() : '';
    if (majorVal) catMeta[catName].major = majorVal;
    if (midVal) catMeta[catName].mid = midVal;
    var name = (row[idx.name] || '').trim();
    if (!name) continue;
    counter++;
    var leadRaw = idx.lead > -1 ? (row[idx.lead] || '').trim().toLowerCase() : '';
    catMap[catName].push({ id: 'ct-' + counter, name: name, role: (idx.role > -1 ? (row[idx.role] || '').trim() : ''), phone: (idx.phone > -1 ? (row[idx.phone] || '').trim() : ''), email: (idx.email > -1 ? (row[idx.email] || '').trim() : ''), lead: !!LEAD_TRUE[leadRaw] });
  }
  return order.map(function (catName) { return { id: 'cat-' + slugify(catName), name: catName, contacts: catMap[catName], major: catMeta[catName].major, mid: catMeta[catName].mid }; });
}

/* ---------------- data loading ---------------- */
// Key used to cache the last-loaded data in this browser's storage — so if the
// sheet can't be reached (offline, briefly down), the app can still show the
// last known data instead of nothing.
var CACHE_KEY = 'gigroster-data-v1';
function loadCache() { try { var raw = localStorage.getItem(CACHE_KEY); return raw ? JSON.parse(raw) : null; } catch (e) { return null; } }
function saveCache(data) { try { localStorage.setItem(CACHE_KEY, JSON.stringify({ data: data, at: Date.now() })); } catch (e) { } }

// Prepares the real data when the app boots (or is refreshed).
// Sorts organizations in Korean (가나다) order, except one pinned organization
// (오클랜드 한인회, the Korean Society itself) which always stays first regardless
// of where it would otherwise fall alphabetically. Applies within whatever
// grouping the org already belongs to, since it just reorders the flat list
// that groupCategoriesByMajor() later buckets by 대분류/중분류.
function sortCategoriesPinFirst(cats, pinnedName) {
  var pinned = cats.filter(function (c) { return c.name === pinnedName; });
  var rest = cats.filter(function (c) { return c.name !== pinnedName; });
  rest.sort(function (a, b) { return a.name.localeCompare(b.name, 'ko'); });
  return pinned.concat(rest);
}

// Order: (1) if a cache exists, render with it right away, (2) if CONFIG.sheetCsvUrl
// is set, fetch the Google Sheet and overwrite everything with the latest content,
// (3) if there's no sheet configured or the fetch fails, fall back to the cache or
// to FALLBACK_DATA.
function loadData() {
  var cached = loadCache();
  if (cached && cached.data) { DATA = cached.data; }
  if (!CONFIG.sheetCsvUrl) {
    if (!cached) DATA = FALLBACK_DATA;
    render();
    return;
  }
  var url = CONFIG.sheetCsvUrl + (CONFIG.sheetCsvUrl.indexOf('?') > -1 ? '&' : '?') + '_=' + Date.now();
  fetch(url, { cache: 'no-store' }).then(function (res) {
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return res.text();
  }).then(function (text) {
    var categories = csvRowsToCategories(parseCSV(text));
    if (!categories.length) throw new Error('빈 데이터');
    categories = sortCategoriesPinFirst(categories, '오클랜드 한인회');
    DATA = { appTitle: FALLBACK_DATA.appTitle, categories: categories };
    saveCache(DATA);
    render();
  }).catch(function (err) {
    console.error('sheet load failed', err);
    if (!cached) { DATA = FALLBACK_DATA; render(); }
  });
}

/* ---------------- toast ---------------- */
// Shows a small message near the bottom of the screen that fades away on its own
// (e.g. "등록된 전화번호가 없어요." — "no phone number on file").
function showToast(msg) {
  var t = document.getElementById('toast');
  if (!t) return;
  t.textContent = msg; t.classList.add('show');
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(function () { t.classList.remove('show'); }, 2200);
}

/* ---------------- search ---------------- */
/* IMPORTANT: typing must never rebuild the <input id="search-input">
   element itself — replacing that DOM node mid-keystroke is what breaks
   a Korean/Japanese/Chinese IME's composition and splits 홍길동 into
   ㅎㅗㅇㄱㅣㄹㄷㅗㅇ. So oninput only refreshes the results container
   below it (#directory-body), never the shell/input around it. */
function onSearchInput(v) {
  session.query = v;
  if (session.view === 'category') updateCategoryBody(); else updateHomeBody();
}

/* ---------------- render: shell ---------------- */
// The core full-screen redraw. Call this whenever `session` changes (opening an
// organization, going back, etc.) — it (1) redraws the current screen (home or
// organization) and (2) shows the contact popup on top of it if one is open.
// (While typing in the search box, this is deliberately NOT used — onSearchInput
// calls updateHomeBody/updateCategoryBody instead, which only refresh the results
// list. Using render() during typing would rebuild the input and break Korean
// text composition.)
function render() {
  var app = document.getElementById('app');
  if (!session.unlocked) { app.innerHTML = renderLockScreen(); focusLockInput(); return; }
  app.innerHTML = renderShell();
  var ov = ensureOverlayRoot();
  if (session.contactId) {
    ov.innerHTML = '<div class="sheet">' + renderContactSheetContent() + '</div>';
    requestAnimationFrame(function () { ov.classList.add('open'); });
  } else {
    ov.classList.remove('open');
    setTimeout(function () { if (!session.contactId) ov.innerHTML = ''; }, 260);
  }
  var sd = ensureSideRoot();
  if (session.sidebarOpen) {
    sd.innerHTML = '<div class="side-panel">' + renderSidebarContent() + '</div>';
    requestAnimationFrame(function () { sd.classList.add('open'); });
  } else {
    sd.classList.remove('open');
    setTimeout(function () { if (!session.sidebarOpen) sd.innerHTML = ''; }, 260);
  }
}
// Creates (once) the container that holds the contact popup — the dimmed
// backdrop plus the sheet that slides up from the bottom. Also wires up
// "tap the backdrop to close".
function ensureOverlayRoot() {
  var el = document.getElementById('overlay-root');
  if (!el) {
    el = document.createElement('div'); el.id = 'overlay-root'; el.className = 'overlay';
    el.addEventListener('click', function (e) { if (e.target === el) closeContact(); });
    document.body.appendChild(el);
  }
  return el;
}
// Creates (once) the container for the left-side "pick organizations" panel —
// the dimmed backdrop plus the sliding panel itself. Tapping the backdrop closes it.
function ensureSideRoot() {
  var el = document.getElementById('side-root');
  if (!el) {
    el = document.createElement('div'); el.id = 'side-root'; el.className = 'side-overlay';
    el.addEventListener('click', function (e) { if (e.target === el) closeSidebar(); });
    document.body.appendChild(el);
  }
  return el;
}
// Adds a thin divider under the top bar once the page is scrolled a bit
// (applies to every screen).
window.addEventListener('scroll', function () {
  var tb = document.getElementById('topbar');
  if (tb) { if (window.scrollY > 4) tb.classList.add('scrolled'); else tb.classList.remove('scrolled'); }
}, { passive: true });

/* ---------------- grouping (대분류 / 중분류 / 소분류) ---------------- */
// Groups the flat list of organizations (each tagged with cat.major / cat.mid,
// read from the sheet's 대분류 / 중분류 columns) into a 대분류 → 중분류 → 소분류(org)
// tree. Used by both the home screen and the org-picker sidebar. An org with no
// 중분류 value is placed directly under its 대분류 with no subheading, since the
// sheet leaves that column blank for some organizations.
function groupCategoriesByMajor(cats) {
  var majorOrder = [], majorMap = {};
  cats.forEach(function (cat) {
    var maj = cat.major || '기타';
    if (!majorMap[maj]) { majorMap[maj] = { ungrouped: [], midOrder: [], midMap: {} }; majorOrder.push(maj); }
    var g = majorMap[maj];
    var mid = cat.mid;
    if (!mid) { g.ungrouped.push(cat); }
    else {
      if (!g.midMap[mid]) { g.midMap[mid] = []; g.midOrder.push(mid); }
      g.midMap[mid].push(cat);
    }
  });
  return majorOrder.map(function (maj) {
    var g = majorMap[maj];
    return { name: maj, ungrouped: g.ungrouped, midGroups: g.midOrder.map(function (mid) { return { name: mid, orgs: g.midMap[mid] }; }) };
  });
}

/* ---------------- render: home (category grid) ---------------- */
// Renders one organization's block: its name/count header, then either its
// "leader" contacts or a hint to open the full roster. Shared by the flat
// listing and the grouped (대분류/중분류) listing below.
function renderOrgBlock(cat) {
  var leaders = cat.contacts.filter(function (c) { return c.lead; });
  return (
    '<div class="org-block">' +
      '<button class="org-head" onclick="openCategory(\'' + cat.id + '\')">' +
        '<span><span class="org-name">' + escapeHtml(cat.name) + '</span><span class="org-cnt">' + cat.contacts.length + '명</span></span>' +
        '<span class="chev">' + ICON_CHEV + '</span>' +
      '</button>' +
      (leaders.length ? leaders.map(function (c) { return renderContactRowDetail(c, cat.id); }).join('')
        : '<p class="org-empty-hint" onclick="openCategory(\'' + cat.id + '\')">등록된 대표자가 없어요. 눌러서 전체 명단 보기</p>') +
    '</div>'
  );
}
// Renders the home screen grouped by 대분류 (major section headings), and within
// each, by 중분류 (sub-headings) when that org has one — otherwise the org is
// listed directly under its 대분류.
function renderHomeGroups() {
  var majors = groupCategoriesByMajor(DATA.categories);
  return majors.map(function (major) {
    var inner = major.ungrouped.map(renderOrgBlock).join('');
    inner += major.midGroups.map(function (mg) {
      return (
        '<div class="mid-head"><span class="mid-title">' + escapeHtml(mg.name) + '</span></div>' +
        '<div class="mid-body">' + mg.orgs.map(renderOrgBlock).join('') + '</div>'
      );
    }).join('');
    return (
      '<div class="major-section">' +
        '<div class="major-title">' + escapeHtml(major.name) + '</div>' +
        '<div class="major-body">' + inner + '</div>' +
      '</div>'
    );
  }).join('');
}
// Renders the home screen's body (everything below the search box).
// - No search query: grouped by 대분류/중분류 when the sheet has that data,
//   otherwise a flat list of organizations — each showing just its "leader"
//   contacts (regular members are only shown inside that organization's page).
// - With a search query: matching people across every organization, grouped by
//   organization.
function renderHomeBody() {
  var q = session.query.trim().toLowerCase();
  if (!DATA.categories.length) {
    return '<div class="empty-state">' + ICON_EMPTY + '<p>아직 등록된 카테고리가 없어요.</p></div>';
  }
  if (!q) {
    var hasMajor = DATA.categories.some(function (c) { return c.major; });
    return hasMajor ? renderHomeGroups() : DATA.categories.map(renderOrgBlock).join('');
  }
  /* searching from the home screen: show matches grouped by category, across everything */
  var sections = DATA.categories.map(function (cat) {
    var contacts = cat.contacts.filter(function (c) {
      return c.name.toLowerCase().indexOf(q) !== -1 || (c.role || '').toLowerCase().indexOf(q) !== -1 || cat.name.toLowerCase().indexOf(q) !== -1;
    });
    return { cat: cat, contacts: contacts };
  }).filter(function (s) { return s.contacts.length; });
  if (!sections.length) {
    return '<div class="empty-state">' + ICON_EMPTY + '<p>"' + escapeHtml(session.query.trim()) + '" 검색 결과가 없어요.</p></div>';
  }
  return sections.map(function (s) {
    return (
      '<div class="section-head"><h2>' + escapeHtml(s.cat.name) + '<span class="cnt">' + s.contacts.length + '명</span></h2></div>' +
      s.contacts.map(function (c) { return renderContactRowDetail(c, s.cat.id); }).join('')
    );
  }).join('');
}
// Called on every keystroke in the search box — swaps out only the results
// list (#directory-body) so the input element itself is never touched and
// Korean text composition never breaks.
function updateHomeBody() {
  var el = document.getElementById('directory-body');
  if (el) el.innerHTML = renderHomeBody();
}
// Renders the whole home screen: top bar, search box, body, and the
// "Send Email to Everyone" bar pinned to the bottom.
function renderHomeShell() {
  var allMail = allMailHref();
  return (
    '<div class="topbar" id="topbar">' +
      '<div class="brand-row">' +
        '<button class="icon-btn" onclick="openSidebar()" aria-label="단체 선택 메뉴">' + ICON_MENU + '</button>' +
        '<div class="brand-mid"><img class="brand-logo" src="' + LOGO_DATA_URI + '" alt=""><h1 class="brand">' + escapeHtml(DATA.appTitle || '한인회 연락망') + '</h1></div>' +
        '<span></span>' +
      '</div>' +
      '<div class="search-wrap"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>' +
      '<input type="text" id="search-input" placeholder="이름, 단체, 직함 검색" value="' + escapeHtml(session.query) + '" oninput="onSearchInput(this.value)"></div>' +
    '</div>' +
    '<main id="directory-body" style="padding-bottom:0;">' + renderHomeBody() + '</main>' +
    '<div class="fab-bar"><button class="fab-mail" ' + (allMail ? '' : 'disabled') + ' onclick="' + (allMail ? 'sendMailToEveryone()' : '') + '">' + ICON_MAIL + ' 전체 메일 발송</button></div>'
  );
}

/* ---------------- render: category detail (drill-in) ---------------- */
// The body of the screen you land on after tapping an organization — shows
// that organization's full roster (everyone, leaders included).
function renderCategoryBody(cat) {
  var q = session.query.trim().toLowerCase();
  var contacts = q ? cat.contacts.filter(function (c) {
    return c.name.toLowerCase().indexOf(q) !== -1 || (c.role || '').toLowerCase().indexOf(q) !== -1;
  }) : cat.contacts;
  if (!cat.contacts.length) {
    return '<div class="empty-state">' + ICON_EMPTY + '<p>아직 등록된 연락처가 없어요.</p></div>';
  }
  if (q && !contacts.length) {
    return '<div class="empty-state">' + ICON_EMPTY + '<p>"' + escapeHtml(session.query.trim()) + '" 검색 결과가 없어요.</p></div>';
  }
  return contacts.map(function (c) { return renderContactRowDetail(c, cat.id); }).join('');
}
// Called on every keystroke in the organization screen's search box — same idea
// as updateHomeBody: only the list refreshes, the input stays untouched.
function updateCategoryBody() {
  var cat = findCategory(session.categoryId);
  var el = document.getElementById('directory-body');
  if (el && cat) el.innerHTML = renderCategoryBody(cat);
}
// Renders the whole organization screen: back button, organization name,
// "email this organization" button, search box, and the roster.
function renderCategoryShell() {
  var cat = findCategory(session.categoryId);
  if (!cat) { session.view = 'home'; session.categoryId = null; return renderHomeShell(); }
  var gmail = groupMailHref(cat);
  return (
    '<div class="topbar" id="topbar">' +
      '<div class="brand-row">' +
        '<button class="icon-btn" onclick="backToHome()" aria-label="뒤로">' + ICON_BACK + '</button>' +
        '<h1 class="brand">' + escapeHtml(cat.name) + '</h1>' +
        (gmail ? '<button class="icon-btn" onclick="sendGroupMail(\'' + cat.id + '\')" aria-label="' + escapeHtml(cat.name) + ' 전체에게 메일">' + ICON_MAIL + '</button>' : '<span></span>') +
      '</div>' +
      '<div class="search-wrap"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>' +
      '<input type="text" id="search-input" placeholder="이름, 직함 검색" value="' + escapeHtml(session.query) + '" oninput="onSearchInput(this.value)"></div>' +
    '</div>' +
    '<main id="directory-body" style="padding-bottom:0;">' + renderCategoryBody(cat) + '</main>'
  );
}

/* ---------------- render: lock screen ---------------- */
// Full-screen password prompt shown instead of the shell while session.unlocked
// is false. Enter key or the button both call tryUnlock().
function renderLockScreen() {
  return '' +
    '<div class="lock-wrap">' +
      '<div class="lock-icon">' + ICON_LOCK + '</div>' +
      '<div class="lock-title">한인회 연락망</div>' +
      '<div class="lock-sub">비밀번호를 입력해주세요</div>' +
      '<input id="lock-input" class="lock-input" type="password" inputmode="text" autocomplete="off" placeholder="비밀번호" onkeydown="if(event.key===\'Enter\'){tryUnlock();}">' +
      '<button class="lock-btn" onclick="tryUnlock()">확인</button>' +
      '<div id="lock-error" class="lock-error"></div>' +
    '</div>';
}
// Puts keyboard focus in the password field right after it's drawn.
function focusLockInput() {
  var input = document.getElementById('lock-input');
  if (input) setTimeout(function () { input.focus(); }, 30);
}

/* ---------------- render: shell dispatch ---------------- */
// Decides whether to render the home screen or the organization screen based
// on session.view.
function renderShell() {
  return session.view === 'category' ? renderCategoryShell() : renderHomeShell();
}
// Builds the HTML for one contact list row (avatar + name + role badge +
// phone/email). Shared by both the home screen (leaders/search results) and
// the organization screen (full roster). Tapping a row calls openContact(),
// which opens that person's detail popup.
function renderContactRowDetail(c, categoryId) {
  var tel = telHref(c.phone), mail = mailHref(c.email);
  var meta = (tel ? '<span>' + ICON_CALL + escapeHtml(c.phone) + '</span>' : '') + (mail ? '<span>' + ICON_MAIL + escapeHtml(c.email) + '</span>' : '');
  return (
    '<div class="contact-row" onclick="openContact(\'' + categoryId + '\',\'' + c.id + '\')">' +
      '<div class="contact-avatar" style="background:' + colorForString(c.name) + '">' + escapeHtml(initials(c.name)) + '</div>' +
      '<div class="contact-main">' +
        '<div class="contact-name-row"><span class="contact-name">' + escapeHtml(c.name) + '</span>' + (c.role ? '<span class="role-badge">' + escapeHtml(c.role) + '</span>' : '') + '</div>' +
        (meta ? '<div class="contact-meta">' + meta + '</div>' : (!tel && !mail ? '<div class="contact-sub">연락처 정보 없음</div>' : '')) +
      '</div><span class="chev">' + ICON_CHEV + '</span></div>'
  );
}
// The bottom green "Send Email to Everyone" button — opens the mail app with
// every organization's every email address filled in as the recipient.
function sendMailToEveryone() {
  var href = allMailHref();
  if (href) location.href = href;
}
// Tapping an organization on the home screen — navigates to that
// organization's full roster screen.
function openCategory(catId) {
  session.view = 'category'; session.categoryId = catId; session.query = ''; session.contactId = null;
  render();
}
// Tapping the back button on the organization screen — returns to the home screen.
function backToHome() {
  session.view = 'home'; session.categoryId = null; session.query = ''; session.contactId = null;
  render();
}

/* ---------------- org-picker sidebar ---------------- */
// Left-side panel: lets someone browse every organization grouped by
// 대분류/중분류, check off just the ones they want, and email only those
// organizations at once (separate from "email this one org" and "email
// everyone"). Opened via the menu icon in the home screen's top bar.
function openSidebar() { session.sidebarOpen = true; render(); }
function closeSidebar() { session.sidebarOpen = false; render(); }
// Builds the sidebar's full content: header, select-all/none shortcuts, the
// grouped checkbox list, and the "email selected organizations" footer button.
function renderSidebarContent() {
  var majors = groupCategoriesByMajor(DATA.categories);
  var selCount = Object.keys(session.selectedOrgIds).length;
  var href = selectedOrgsMailHref();
  var body = !DATA.categories.length
    ? '<p class="hint">등록된 단체가 없어요.</p>'
    : majors.map(function (major) {
        var midIdLists = major.midGroups.map(function (mg) { return mg.orgs.map(function (c) { return c.id; }); });
        var allMidIds = midIdLists.reduce(function (a, b) { return a.concat(b); }, []);
        var allIds = major.ungrouped.map(function (c) { return c.id; }).concat(allMidIds);
        var html = renderGroupCheckbox('side-major-title', major.name, allIds);
        html += major.ungrouped.map(renderSideOrgRow).join('');
        html += major.midGroups.map(function (mg, i) {
          return renderGroupCheckbox('side-mid-title', mg.name, midIdLists[i]) + mg.orgs.map(renderSideOrgRow).join('');
        }).join('');
        return html;
      }).join('');
  return (
    '<div class="side-head"><span class="side-title">단체 선택</span>' +
      '<button class="close-x" onclick="closeSidebar()" aria-label="닫기">' + ICON_CLOSE + '</button>' +
    '</div>' +
    '<div class="side-toolbar">' +
      '<button class="side-link" onclick="selectAllOrgs(true)">전체 선택</button>' +
      '<button class="side-link" onclick="selectAllOrgs(false)">전체 해제</button>' +
    '</div>' +
    '<div class="side-list">' + body + '</div>' +
    '<div class="side-footer">' +
      '<div class="side-count">' + selCount + '개 단체 선택됨</div>' +
      '<div class="hint" style="text-align:center; margin:0 0 8px; color:#5E3122;">각 단체의 대표자에게만 메일이 발송돼요</div>' +
      '<button class="side-mail-btn" ' + (href ? '' : 'disabled') + ' onclick="' + (href ? 'sendMailToSelected()' : '') + '">' + ICON_MAIL + ' 선택 단체에 메일 보내기</button>' +
    '</div>'
  );
}
// A checkbox + label pair placed in front of a 대분류/중분류 heading — checking
// it selects (or clears) every organization id listed in `ids` at once.
function renderGroupCheckbox(cls, label, ids) {
  var checked = ids.length > 0 && ids.every(function (id) { return !!session.selectedOrgIds[id]; });
  return (
    '<label class="' + cls + '">' +
      '<input type="checkbox" data-ids="' + ids.join(',') + '" ' + (checked ? 'checked' : '') + ' onchange="toggleGroupSelect(this)">' +
      escapeHtml(label) +
    '</label>'
  );
}
// One checkbox row inside the sidebar list, for a single organization (소분류).
function renderSideOrgRow(cat) {
  var checked = !!session.selectedOrgIds[cat.id];
  return (
    '<label class="side-org-row">' +
      '<input type="checkbox" ' + (checked ? 'checked' : '') + ' onchange="toggleOrgSelect(\'' + cat.id + '\', this.checked)">' +
      '<span class="side-org-name">' + escapeHtml(cat.name) + '</span>' +
      '<span class="side-org-cnt">' + cat.contacts.length + '명</span>' +
    '</label>'
  );
}
// Redraws just the sidebar panel's content (checkbox list + footer) after a
// selection changes, without touching the screen behind it. Keeps the list's
// scroll position instead of resetting to the top — replacing .side-list's
// innerHTML creates a brand-new scrollable element, which would otherwise
// snap it back to scrollTop 0 every time a checkbox down the list is ticked.
function updateSidebarBody() {
  var el = document.getElementById('side-root');
  var panel = el && el.querySelector('.side-panel');
  if (!panel) return;
  var oldList = panel.querySelector('.side-list');
  var scrollTop = oldList ? oldList.scrollTop : 0;
  panel.innerHTML = renderSidebarContent();
  var newList = panel.querySelector('.side-list');
  if (newList) newList.scrollTop = scrollTop;
}
function toggleOrgSelect(id, checked) {
  if (checked) session.selectedOrgIds[id] = true; else delete session.selectedOrgIds[id];
  updateSidebarBody();
}
// Checking the checkbox in front of a 대분류/중분류 heading selects (or clears)
// every organization under it at once. `checkbox` is the checkbox element
// itself so we can read back the org ids it was rendered with.
function toggleGroupSelect(checkbox) {
  var ids = (checkbox.dataset.ids || '').split(',').filter(Boolean);
  ids.forEach(function (id) {
    if (checkbox.checked) session.selectedOrgIds[id] = true; else delete session.selectedOrgIds[id];
  });
  updateSidebarBody();
}
function selectAllOrgs(on) {
  session.selectedOrgIds = {};
  if (on) DATA.categories.forEach(function (c) { session.selectedOrgIds[c.id] = true; });
  updateSidebarBody();
}
// Collects the leader's (대표) email for each currently-checked organization —
// not every member's — so a group email through the sidebar reaches just the
// person representing each selected organization (e.g. checking 노인회 only
// emails its 회장).
function selectedOrgsMailHref() {
  var emails = [];
  DATA.categories.forEach(function (cat) {
    if (!session.selectedOrgIds[cat.id]) return;
    cat.contacts.forEach(function (c) { if (c.lead && c.email) emails.push(c.email); });
  });
  if (!emails.length) return null;
  var subject = encodeURIComponent('[' + (DATA.appTitle || '한인회 연락망') + '] 안내 메일');
  return 'mailto:' + emails.join(',') + '?subject=' + subject;
}
function sendMailToSelected() {
  var href = selectedOrgsMailHref();
  if (href) location.href = href; else showToast('선택한 단체에 등록된 대표자 이메일이 없어요.');
}

/* ---------------- actions ----------------
   What actually happens when the phone/mail icon buttons are tapped. */
// Tapping the phone icon — opens the phone app if a number is on file,
// otherwise shows a toast.
function callContact(categoryId, contactId) {
  var cat = findCategory(categoryId), c = cat && findContact(cat, contactId), href = c && telHref(c.phone);
  if (href) location.href = href; else showToast('등록된 전화번호가 없어요.');
}
// Tapping the mail icon — opens the mail app if an email is on file,
// otherwise shows a toast.
function emailContact(categoryId, contactId) {
  var cat = findCategory(categoryId), c = cat && findContact(cat, contactId), href = c && mailHref(c.email);
  if (href) location.href = href; else showToast('등록된 이메일이 없어요.');
}
// Tapping the mail icon at the top of an organization screen — emails
// everyone in that organization.
function sendGroupMail(categoryId) {
  var cat = findCategory(categoryId), href = cat && groupMailHref(cat);
  if (href) location.href = href;
}

/* ---------------- contact detail (popup sheet over the current screen) ---------------- */
// Tapping a contact row — opens the detail popup on top of whichever screen
// (home or organization) you were on.
function openContact(categoryId, contactId) {
  session.categoryId = categoryId;
  session.contactId = contactId;
  render();
}
// Tapping the popup's X button or the dimmed backdrop — closes just the
// popup, leaving the screen underneath exactly as it was.
function closeContact() {
  session.contactId = null;
  render();
}
// Builds the popup's content: avatar, name + role, organization name, and
// the phone/email rows with their call/mail action buttons.
function renderContactSheetContent() {
  var cat = findCategory(session.categoryId), c = cat && findContact(cat, session.contactId);
  if (!cat || !c) {
    return '<div class="sheet-handle"></div><button class="close-x" onclick="closeContact()" aria-label="닫기">' + ICON_CLOSE + '</button><p class="hint">연락처를 찾을 수 없어요.</p>';
  }
  var tel = telHref(c.phone), mail = mailHref(c.email);
  var titleLine = c.name + (c.role ? ' ' + c.role : '');
  return (
    '<div class="sheet-handle"></div>' +
    '<button class="close-x" onclick="closeContact()" aria-label="닫기">' + ICON_CLOSE + '</button>' +
    '<div class="contact-avatar-lg" style="background:' + colorForString(c.name) + '">' + escapeHtml(initials(c.name)) + '</div>' +
    '<div class="contact-page-name">' + escapeHtml(titleLine) + '</div>' +
    '<div class="contact-page-org">' + escapeHtml(cat.name) + '</div>' +
    (tel ? '<div class="detail-row"><div class="detail-row-text"><div class="detail-label">연락처</div><div class="detail-value tabular">' + escapeHtml(c.phone) + '</div></div><button class="detail-action call" onclick="callContact(\'' + cat.id + '\',\'' + c.id + '\')" aria-label="전화 걸기">' + ICON_CALL + '</button></div>' : '') +
    (mail ? '<div class="detail-row"><div class="detail-row-text"><div class="detail-label">이메일</div><div class="detail-value email">' + escapeHtml(c.email) + '</div></div><button class="detail-action mail" onclick="emailContact(\'' + cat.id + '\',\'' + c.id + '\')" aria-label="이메일 보내기">' + ICON_MAIL + '</button></div>' : '') +
    ((!tel && !mail) ? '<p class="hint" style="text-align:center;">등록된 전화번호나 이메일이 없어요.</p>' : '')
  );
}

/* ---------------- boot ---------------- */
// Runs once as soon as the page loads — fetches the data and renders the
// first screen.
loadData();
</script>
</body>
</html>
